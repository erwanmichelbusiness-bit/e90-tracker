name: tracker-e90

on:
  schedule:
    # Plafond theorique 5 min ; GitHub honore ~1 creneau sur 3 (mesure).
    # La source elle-meme a 2-8 h de latence, donc viser plus serre
    # n'apporterait rien et solliciterait Google inutilement.
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode d'execution"
        type: choice
        default: normal
        options: [normal, ping, force-amorce]
      chat_id_test:
        description: "Ping mode uniquement : teste CE chat_id, sans toucher au secret TELEGRAM_CHAT_ID"
        type: string
        default: ""
      ping_text:
        description: "Ping mode uniquement : texte personnalise (sinon message de controle standard)"
        type: string
        default: ""

concurrency:
  group: tracker-e90
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collecte, scoring et notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MODE: ${{ inputs.mode }}
          CHAT_ID_TEST: ${{ inputs.chat_id_test }}
          PING_TEXT: ${{ inputs.ping_text }}
        run: |
          case "$MODE" in
            ping)
              ARGS=(--ping)
              [ -n "$CHAT_ID_TEST" ] && ARGS=(--ping-chat-id "$CHAT_ID_TEST")
              [ -n "$PING_TEXT" ] && ARGS+=(--ping-text "$PING_TEXT")
              python run.py "${ARGS[@]}"
              ;;
            force-amorce) python run.py --force-amorce ;;
            *)            python run.py ;;
          esac

      - name: Persistance de l'etat
        run: |
          git config user.name  "tracker-e90"
          git config user.email "tracker-e90@users.noreply.github.com"
          if [ -n "$(git status --porcelain state/)" ]; then
            git add state/
            git commit -m "state: $(date -u +%FT%TZ)"
            git pull --rebase --autostash origin main || true
            git push
          else
            echo "aucun changement d'etat"
          fi
